name: Build and Release Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix if present
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if this is a beta release
          if [[ "$VERSION" == *"beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            # Extract base version (e.g., "1.2.3-beta.1" -> "1.2.3-beta.1")
            echo "exact_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
            # Parse semantic version components
            IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}
            
            echo "major=$MAJOR" >> $GITHUB_OUTPUT
            echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
            echo "patch=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
            echo "exact_version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Validate version matches pyproject.toml
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          
          # Read version from pyproject.toml using Python
          PYPROJECT_VERSION=$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version'])")
          
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          
          # For beta releases, check if tag starts with pyproject version
          # For regular releases, versions must match exactly
          if [[ "$TAG_VERSION" == *"beta"* ]]; then
            # Extract base version from tag (e.g., "1.2.3-beta.1" -> "1.2.3")
            BASE_VERSION=$(echo "$TAG_VERSION" | sed 's/-beta.*//')
            if [[ "$PYPROJECT_VERSION" != "$BASE_VERSION" ]]; then
              echo "ERROR: Tag base version ($BASE_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
              exit 1
            fi
          else
            if [[ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]]; then
              echo "ERROR: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
              exit 1
            fi
          fi
          
          echo "✓ Version validation passed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Release)
        if: steps.version.outputs.is_beta == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.patch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.exact_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (Beta)
        if: steps.version.outputs.is_beta == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.exact_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

