name: Build and Release Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix if present
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if this is a beta release
          if [[ "$VERSION" == *"beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            # Extract base version (e.g., "1.2.3-beta.1" -> "1.2.3-beta.1")
            echo "exact_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
            # Parse semantic version components
            IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}
            
            echo "major=$MAJOR" >> $GITHUB_OUTPUT
            echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
            echo "patch=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
            echo "exact_version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Release)
        if: steps.version.outputs.is_beta == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.patch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.exact_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (Beta)
        if: steps.version.outputs.is_beta == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.exact_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

